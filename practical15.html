        <p><strong>Code:</strong></p>
        <textarea id="code1" class="code-area" readonly>import breeze.linalg._
import breeze.numerics._

object Main extends App {
  val trainingData = List(
    (DenseVector(11.0, 22.0), "Class A"),
    (DenseVector(28.0, 32.0), "Class A"),
    (DenseVector(45.0, 78.0), "Class B"),
    (DenseVector(84.0, 92.0), "Class B")
  )

  val testPoint = DenseVector(50.0, 80.0)

  def euclideanDistance(
      v1: DenseVector[Double],
      v2: DenseVector[Double]
  ): Double = {
    norm(v1 - v2)
  }

  println("Training Data")
  println("-------------")
  val distances = trainingData.map {
    case (point, label) =>
      val distance = euclideanDistance(point, testPoint)
      println(f"$point\\t$label\\tDistance = $distance%.2f")
      (distance, label)
  }

  val nearest = distances.minBy(_._1)

  println("\\n-------------")
  println("Test point: " + testPoint)
  println("Nearest class: " + nearest._2)
  println(f"Distance: ${nearest._1}%.2f")
  println("\\nPrediction:")
  println("The test point belongs to " + nearest._2)
}</textarea>
        <button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>

    <script>
        function copyCode(id, button) {
            const code = document.getElementById(id);
            code.select();
            code.setSelectionRange(0, 999999);
            navigator.clipboard.writeText(code.value).then(() => {
                button.textContent = "✅ Copied!";
                setTimeout(() => button.textContent = "📋 Copy", 2000);
            });
        }
    </script>
