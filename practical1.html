<!DOCTYPE html>
<html>
<head>
    <title>Practical Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 700px;
            max-width: calc(100% - 50px);
            margin: auto;
        }
        h1 { color: #222; }
        .back-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .back-btn:hover { background: #0056b3; }
        .code-box { margin-top: 10px; }
        textarea {
            width: 100%;
            min-height: 230px;
            box-sizing: border-box;
            font-family: Consolas, monospace;
            font-size: 15px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            white-space: pre;
        }
        button {
            margin-top: 8px;
            background: #007bff;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
        <h1>Practical No. 1</h1>
        <h2>Environment Setup and Basic Scala Program</h2>
        <ul>
            <li>Install and configure Scala and SBT.</li>
            <li>Write a simple Scala program to print a welcome message for data scientists.</li>
            <li>Compile and run using SBT.</li>
        </ul>
        <h3>Code</h3>
        <div class="code-box">
            <textarea id="code1" readonly>object HelloWorld {
  def main(args: Array[String]): Unit = {
    println("Hello, world!")
  }
}</textarea>
            <button onclick="copyCode('code1', this)">📋 Copy</button>
        </div>
    </div>
    <script>
        function copyCode(id, button) {
            const code = document.getElementById(id);
            navigator.clipboard.writeText(code.value).then(() => {
                button.innerText = "✅ Copied!";
                setTimeout(() => button.innerText = "📋 Copy", 2000);
            });
        }
    </script>
</body>
</html>
