<h2>Implement Simple Queue Using Array (Enqueue and Dequeue)</h2>
<textarea id="code1" readonly>queue = []

def enqueue(item):
    queue.append(item)
    print(item, "inserted into queue")

def dequeue():
    if len(queue) == 0:
        print("Queue underflow")
    else:
        print(queue.pop(0), "deleted from queue")

def display():
    if len(queue) == 0:
        print("Queue is empty")
    else:
        print("Queue Elements:", queue)

enqueue(10)
enqueue(20)
enqueue(30)
display()
dequeue()
display()</textarea>

<div class="container">
<h2>Implement Circular Queue</h2>
<textarea id="code4" readonly>size = 5
queue = [None] * size
front = -1
rear = -1

def enqueue(item):
    global front, rear
    if (rear + 1) % size == front:
        print("Queue overflow")
    elif front == -1:
        front = rear = 0
        queue[rear] = item
    else:
        rear = (rear + 1) % size
        queue[rear] = item

def dequeue():
    global front, rear
    if front == -1:
        print("Queue underflow")
    else:
        print(queue[front], "deleted")
        if front == rear:
            front = rear = -1
        else:
            front = (front + 1) % size

def display():
    if front == -1:
        print("Queue is empty")
    else:
        i = front
        while True:
            print(queue[i], end=" ")
            if i == rear:
                break
            i = (i + 1) % size
        print()

enqueue(10)
enqueue(20)
enqueue(30)
enqueue(40)
enqueue(50)
display()
dequeue()
display()
enqueue(60)
display()</textarea>
