<!DOCTYPE html>
<html>
<head>
    <title>Practical Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 700px;
            max-width: calc(100% - 50px);
            margin: auto;
        }
        .back-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-btn:hover { background: #0056b3; }
        textarea {
            width: 100%;
            min-height: 390px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            white-space: pre;
        }
        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
            margin: 8px 0 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
        <h2>Practical No. 4: Vector Operations using Breeze</h2>
        <ul>
            <li>Create dense vector using Breeze.</li>
            <li>Compute sum and mean of a vector.</li>
            <li>Calculate dot product between two vectors.</li>
        </ul>
        <h3>Code:</h3>
        <textarea id="code1" readonly>import breeze.linalg._

object Main {
    def main(args: Array[String]): Unit = {
        val vector1 = DenseVector(12, 24, 36, 48, 60)
        val vector2 = DenseVector(2, 4, 6, 8, 10)
        val sum = breeze.linalg.sum(vector1)
        val mean = sum / vector1.length
        val dotProduct = vector1.dot(vector2)

        println("Breeze Vector Operations")
        println("Vector 1: " + vector1)
        println("Vector 2: " + vector2)
        println("Sum of Vector 1: " + sum)
        println("Mean of Vector 1: " + mean)
        println("Dot Product: " + dotProduct)
    }
}</textarea>
        <button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
    </div>
    <script>
        function copyCode(id, button) {
            const code = document.getElementById(id);
            code.select();
            code.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(code.value).then(() => {
                button.innerText = "✅ Copied!";
                setTimeout(() => button.innerText = "📋 Copy", 2000);
            });
        }
    </script>
</body>
</html>
