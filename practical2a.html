<h2>Stack Implementation Using Singly Linked List</h2>
<textarea id="code1" readonly># Stack implementation using singly linked list

class Node:
    def __init__(self, data):
        self.data = data
        self.next = None

class Stack:
    def __init__(self):
        self.top = None

    def push(self, data):
        new_node = Node(data)
        new_node.next = self.top
        self.top = new_node
        print(data, "pushed into stack.")

    def pop(self):
        if self.top is None:
            print("Stack underflow!")
        else:
            temp = self.top
            self.top = self.top.next
            print(temp.data, "popped from stack.")

    def display(self):
        if self.top is None:
            print("Stack is empty")
        else:
            temp = self.top
            print("Stack Elements:")
            while temp:
                print(temp.data)
                temp = temp.next

s = Stack()
s.push(10)
s.push(20)
s.push(30)
s.display()
s.pop()
s.display()</textarea>

<h2>Infix Expression to Postfix</h2>
<textarea id="code2" readonly>def precedence(op):
    if op == '+' or op == '-':
        return 2
    elif op == '*' or op == '/':
        return 2
    elif op == '^':
        return 3
    return 0

def infix_to_postfix(expression):
    stack = []
    postfix = ""
    for ch in expression:
        if ch.isalnum():
            postfix += ch
        elif ch == '(':
            stack.append(ch)
        elif ch == ')':
            while stack and stack[-1] != '(':
                postfix += stack.pop()
            stack.pop()
        else:
            while stack and precedence(ch) <= precedence(stack[-1]):
                postfix += stack.pop()
            stack.append(ch)
    while stack:
        postfix += stack.pop()
    return postfix

expr = input("Enter Infix Expression: ")
print("Postfix Expression:", infix_to_postfix(expr))</textarea>

<h2>Evaluate Postfix Expression</h2>
<textarea id="code3" readonly>stack = []
postfix = input("Enter Postfix Expression (e.g. 23+5*): ")

for ch in postfix:
    if ch.isdigit():
        stack.append(int(ch))
    else:
        b = stack.pop()
        a = stack.pop()
        if ch == '+':
            stack.append(a + b)
        elif ch == '-':
            stack.append(a - b)
        elif ch == '*':
            stack.append(a * b)
        elif ch == '/':
            stack.append(a / b)

print("Result =", stack.pop())</textarea>

<h2>Check Balanced Parentheses Using Stack</h2>
<textarea id="code4" readonly>def check_balance(expression):
    stack = []
    for ch in expression:
        if ch == '(':
            stack.append(ch)
        elif ch == ')':
            if len(stack) == 0:
                return "Not Balanced"
            stack.pop()
    if len(stack) == 0:
        return "Balanced"
    return "Not Balanced"

expr = input("Enter Expression: ")
print(check_balance(expr))</textarea>
