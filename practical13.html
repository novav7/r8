<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 2.3 - Linear Regression Using Breeze</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 700px;
            max-width: calc(100% - 50px);
            margin: auto;
        }
        .back-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .code-area {
            width: 100%;
            min-height: 850px;
            box-sizing: border-box;

            font-size: 14px;
            padding: 12px;
            border: 1px solid #ccc;

        .copy-btn {
            margin-top: 10px;

</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
        <h1>Practical No. 2.3: Linear Regression Using Breeze</h1>
        <p><strong>Code:</strong></p>
        <textarea id="code1" class="code-area" readonly>import breeze.linalg._

object Main extends App {
  val x = DenseVector(10.0, 5.0, 7.0, 9.0, 3.0)
  val y = DenseVector(2.0, 1.0, 8.0, 10.0, 12.0)

  val X = DenseMatrix.horzcat(
    DenseVector.ones[Double](x.length).toDenseMatrix.t,
    x.toDenseMatrix.t
  )

  val beta = inv(X.t * X) * X.t * y
  val intercept = beta(0)
  val slope = beta(1)

  println("Linear Regression Model")
  println("---------------")
  println(f"Intercept = $intercept%.4f")
  println(f"Slope = $slope%.4f")

  val predicted = X * beta
  println("\\nActual \\t Predicted")
  for (i <- 0 until y.length) {
    println(f"${y(i)}%6.2f \\t ${predicted(i)}%6.2f")
  }

  val newX = 6.0
  val prediction = intercept + slope * newX

  println("\\nPrediction")
  println("---------------")
  println(f"For x = $newX%.1f, Predicted value = $prediction%.2f")
}</textarea>
        <button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
    </div>
    <script>
        function copyCode(id, button) {
            const code = document.getElementById(id);
            code.select();
            code.setSelectionRange(0, 999999);
            navigator.clipboard.writeText(code.value).then(() => {
                button.textContent = "✅ Copied!";
                setTimeout(() => button.textContent = "📋 Copy", 2000);
            });
        }
    </script>
</body>
</html>
