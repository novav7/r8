<h1>Practical 9: Join Two CSV Files Using Spark DataFrame</h1>
<ul>
<li>Join two CSV files using a common column.</li>
<li>Write output to a new file.</li>
</ul>
<p><strong>Program:</strong></p>
<textarea id="code1" class="code-area" readonly>from pyspark.sql import SparkSession

spark = SparkSession.builder \
    .appName("Join Example") \
    .getOrCreate()

students = [
    (101, "Aarav"),
    (102, "Anaya"),
    (103, "Rohan"),
    (104, "Jina"),
    (105, "Kabir")
]

marks = [
    (101, 85),
    (102, 92),
    (103, 78),
    (104, 63),
    (105, 88)
]

df1 = spark.createDataFrame(students, ["ID", "Name"])
df2 = spark.createDataFrame(marks, ["ID", "Marks"])

joined_df = df1.join(df2, on="ID", how="inner")
joined_df.show()

joined_df.write.csv("output.csv", header=True)

spark.stop()</textarea>
<button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
</div>
<script>
function copyCode(id, button) {
    const code = document.getElementById(id);
    code.select();
    code.setSelectionRange(0, 999999);
    navigator.clipboard.writeText(code.value).then(() => {
        button.textContent = "✅ Copied!";
        setTimeout(() => button.textContent = "📋 Copy", 2000);
    });
}
</script>
</body>
