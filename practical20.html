<h1>Practical 10: Spark ML and Feature Engineering</h1>
<ul>
<li>Create synthetic time-series data.</li>
<li>Create polynomial features up to degree 3 for a dataset.</li>
<li>Analyze model performance.</li>
</ul>
<p><strong>Program:</strong></p>
<textarea id="code1" class="code-area" readonly>from pyspark.sql import SparkSession
from pyspark.ml.feature import VectorAssembler
from pyspark.ml.classification import LogisticRegression
from pyspark.ml.evaluation import MulticlassClassificationEvaluator
from pyspark.ml import Pipeline

spark = SparkSession.builder \
    .appName("MLlib Pipeline Example") \
    .master("local[*]") \
    .getOrCreate()

data = [
    (2.0, 0),
    (3.0, 0),
    (4.0, 0),
    (5.0, 1),
    (6.0, 1),
    (7.0, 1),
    (8.0, 1),
    (9.0, 1)
]

df = spark.createDataFrame(data, ["x", "label"])
df = df.withColumn("x2", df.x * df.x)
df = df.withColumn("x3", df.x * df.x * df.x)

print("Dataset")
df.show()

assembler = VectorAssembler(
    inputCols=["x", "x2", "x3"],
    outputCol="features"
)

lr = LogisticRegression(
    featuresCol="features",
    labelCol="label"
)

pipeline = Pipeline(stages=[assembler, lr])
model = pipeline.fit(df)
prediction = model.transform(df)

print("Prediction")
prediction.select("x", "label", "prediction").show()

evaluator = MulticlassClassificationEvaluator(
    labelCol="label",
    predictionCol="prediction",
    metricName="accuracy"
)

accuracy = evaluator.evaluate(prediction)
print(f"Accuracy = {accuracy}")

spark.stop()</textarea>
