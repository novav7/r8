<!DOCTYPE html>

<body>
<div class="container">
    <a href="index.html" class="back-btn">⬅ Back to Home</a>
    <h2>Practical 5: Matrix Operations using Breeze</h2>
    <ul>
        <li>Generate a random matrix.</li>
        <li>Compute transpose and determinants.</li>
        <li>Interpret matrix properties.</li>
    </ul>
    <h3>Code</h3>
    <textarea id="code1" readonly>import breeze.linalg._
import breeze.stats.distributions.Rand

object Main {
  def main(args: Array[String]): Unit = {
    val matrix = DenseMatrix.rand[Double](3, 5, Rand.uniform)
    val transposeMatrix = matrix.t
    val determinant = det(matrix)

    println("Matrix operations (Breeze)")
    println("Original matrix:")
    println("\nTranspose matrix:")
    println(transposeMatrix)
    println(f"\nDeterminant: $determinant%.4f")
    println("\nInterpretation:")
    if (math.abs(determinant) < 1e-6)
      println("The matrix is singular (non-invertible).")
  }
}</textarea>
    <button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
</div>
<script>
function copyCode(id, button) {
    const code = document.getElementById(id);
    code.select();
    code.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(code.value).then(() => {
        button.innerText = "✅ Copied!";
        setTimeout(() => button.innerText = "📋 Copy", 2000);
    });
}
</script>
</body>
