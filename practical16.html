        <h1>Practical No. 2.6</h1>
        <p><strong>Code:</strong></p>
        <textarea id="code1" class="code-area" readonly>import breeze.linalg._

object Main extends App {
  val data = List(
    DenseVector(1.0, 2.0),
    DenseVector(3.0, 4.0),
    DenseVector(5.0, 2.0),
    DenseVector(7.0, 7.0),
    DenseVector(4.0, 8.0),
    DenseVector(0.0, 8.0)
  )

  var centroid1 = DenseVector(1.0, 2.0)
  var centroid2 = DenseVector(8.0, 8.0)

  def distance(
      a: DenseVector[Double],
      b: DenseVector[Double]
  ): Double = {
    norm(a - b)
  }

  val clusters = data.map { point =>
    val d1 = distance(point, centroid1)
    val d2 = distance(point, centroid2)
    if (d1 <= d2)
      (point, 1)
    else
      (point, 2)
  }

  println("Point\\tCluster")
  clusters.foreach {
    case (point, cluster) =>
      println(s"$point\\t$cluster")
  }

  val cluster1 = clusters.filter(_._2 == 1).map(_._1)
  val cluster2 = clusters.filter(_._2 == 2).map(_._1)

  def meanVector(
      points: List[DenseVector[Double]]
  ): DenseVector[Double] = {
    val sum = points.reduce(_ + _)
    sum / points.length.toDouble
  }

  centroid1 = meanVector(cluster1)
  centroid2 = meanVector(cluster2)

  println("\\nNew Centroids")
  println("Centroid 1 = " + centroid1)
  println("Centroid 2 = " + centroid2)
}</textarea>
        <button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>

    <script>

                button.textContent = "✅ Copied!";
                setTimeout(() => button.textContent = "📋 Copy", 2000);

        }
