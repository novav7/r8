<style>
body { font-family: Arial; background: #f5f5f5; margin: 40px; }
.container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 700px; max-width: calc(100% - 50px); margin: auto; }

<body>
<div class="container">
<a href="index.html" class="back-btn">⬅ Back to Home</a>
<h1>Practical 7: Introduction to Apache Spark</h1>
<ul>
<li>Set up Apache Spark locally.</li>
<li>Perform word count on a text file using Spark.</li>
</ul>
<p><strong>Program:</strong></p>
<textarea id="code1" class="code-area" readonly>from pyspark.sql import SparkSession

spark = SparkSession.builder \
    .appName("Word Count") \
    .master("local[*]") \
    .getOrCreate()

sc = spark.sparkContext

data = [
    "Scala is powerful",
    "Spark is fast",
    "Big data is great",
    "Scala works well"
]

text = sc.parallelize(data)

word_count = (text.flatMap(lambda line: line.split())
              .map(lambda word: (word, 1))
              .reduceByKey(lambda a, b: a + b))

print(word_count.collect())

spark.stop()</textarea>
<button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
</div>
<script>
function copyCode(id, button) {
    const code = document.getElementById(id);
    code.select();
    code.setSelectionRange(0, 999999);
    navigator.clipboard.writeText(code.value).then(() => {
        button.textContent = "✅ Copied!";
        setTimeout(() => button.textContent = "📋 Copy", 2000);
    });
}
</script>
</body>
