<h1>Practical 8: Read CSV File Using Scala</h1>
<p>CSV Handling &amp; Basic Statistics — calculate basic statistics.</p>
<p><strong>Program:</strong></p>
<textarea id="code1" class="code-area" readonly>object Main extends App {
  val csvData =
    """name,marks
Amit,78
Priya,85
Rahul,92
Sneha,88
Karan,75
Jyoti,89
Sarika,93""".stripMargin

  val lines = csvData.split("\n").drop(1)
  val marks = lines.map(_.split(",")(1).toDouble)
  val mean = marks.sum / marks.length
  val minimum = marks.min
  val maximum = marks.max

  println("CSV Statistical Report")
  println("CSV Data: " + csvData)
  println("Mean marks: " + mean)
  println("Minimum marks: " + minimum)
  println("Maximum marks: " + maximum)
}</textarea>
<button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
</div>
<script>
function copyCode(id, button) {
    const code = document.getElementById(id);
    code.select();
    code.setSelectionRange(0, 999999);
    navigator.clipboard.writeText(code.value).then(() => {
        button.textContent = "✅ Copied!";
        setTimeout(() => button.textContent = "📋 Copy", 2000);
    });
}
</script>
</body>
