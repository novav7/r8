<body>
    <div class="container">
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
        <h1>Practical 2.1: Pearson Correlation &amp; Moving Average</h1>
        <p><strong>Code:</strong></p>
        <textarea id="code1" class="code-area" readonly>object Main extends App {
  val x = List(12.0, 20.0, 32.0, 52.0, 62.0)
  val y = List(14.0, 22.0, 34.0, 45.0, 78.0)

  val meanX = x.sum / x.length
  val meanY = y.sum / y.length

  val numerator = (x zip y).map {
    case (a, b) => (a - meanX) * (b - meanY)
  }.sum

  val denominatorX = math.sqrt(x.map(a => math.pow(a - meanX, 2)).sum)
  val denominatorY = math.sqrt(y.map(b => math.pow(b - meanY, 2)).sum)

  val correlation = numerator / (denominatorX * denominatorY)

  val window = 3
  val movingAverage =
    x.sliding(window)
      .map(list => list.sum / window)
      .toList

  println("=== Pearson Correlation ===")
  println("Dataset X: " + x.mkString(", "))
  println("Dataset Y: " + y.mkString(", "))
  println(f"Correlation Coefficient: $correlation%.2f")

  println("\\n=== Moving Average ===")
  println("Time Series: " + x.mkString(", "))
  println("Window Size: " + window)
  println("Moving Average: " + movingAverage.mkString(", "))

  println("\\n=== Interpretation ===")
  if (correlation > 0.8)
    println("Strong positive correlation")
  else if (correlation < -0.8)
    println("Strong negative correlation")
  else
    println("Weak or moderate correlation")

  println("The moving average smooths short-term fluctuations and shows the overall trend.")
}</textarea>
        <button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
        <p><strong>Output (as visible in the photo):</strong></p>

    <script>
        function copyCode(id, button) {
            const code = document.getElementById(id);
            code.select();
            code.setSelectionRange(0, 999999);
            navigator.clipboard.writeText(code.value).then(() => {
                button.textContent = "✅ Copied!";
                setTimeout(() => button.textContent = "📋 Copy", 2000);
            });
        }
