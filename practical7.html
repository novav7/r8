<!DOCTYPE html>
<html>
<head>
    <title>Practical Page</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 700px;
            max-width: calc(100% - 50px);
            margin: auto;
        }
        .back-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-btn:hover { background: #0056b3; }
        textarea {
            width: 100%;
            height: 460px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            padding: 12px;
            resize: vertical;
        }
        .copy-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
            margin: 8px 0 20px;
        }
        h2 { color: #222; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
        <h2>Practical 7: Element-wise Matrix Operations</h2>
        <ul>
            <li>Perform addition, subtraction, multiplication, and division of two Breeze matrices.</li>
            <li>Verify result mathematically.</li>
        </ul>
        <h3>Code:</h3>
        <textarea id="code1" readonly>import breeze.linalg._

object Main {
  def main(args: Array[String]): Unit = {
    val matrixA = DenseMatrix(
      (5, 9),
      (8, 2)
    )

    val matrixB = DenseMatrix(
      (9, 4),
      (5, 7)
    )

    val addition = matrixA + matrixB
    val subtraction = matrixA - matrixB
    val multiplication = matrixA * matrixB

    println("Addition")
    println(addition)

    println("Subtraction")
    println(subtraction)

    println("Multiplication")
    println(multiplication)
  }
}</textarea>
        <button class="copy-btn" onclick="copyCode('code1', this)">📋 Copy</button>
    </div>
    <script>
        function copyCode(id, button) {
            const code = document.getElementById(id);
            code.select();
            code.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(code.value).then(() => {
                button.innerText = "✅ Copied!";
                setTimeout(() => button.innerText = "📋 Copy", 2000);
            });
        }
    </script>
</body>
</html>
